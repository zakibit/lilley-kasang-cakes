<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>

<body>
    <main>
        <div class="loginContainer signupContainer">
            <h1>Sign Up</h1>
            <form class="signupForm" id="signupForm">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" name="fullName" required placeholder="John Doe">

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="Example@mail.com">

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required minlength="8"
                    placeholder="At least 8 characters">

                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8"
                    placeholder="Re-enter password">

                <p id="signupError" class="error"></p>

                <button type="submit" id="loginBtn">Sign Up</button>
            </form>
            <p id="success" class="success"></p>
            <p>Already have an account? <a href="/login.html">Login</a></p>
            <a href="index.html" class="btn-home">Back to Homepage</a>
        </div>
    </main>
</body>
<script src="/script.js"></script>

</html>
