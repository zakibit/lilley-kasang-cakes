<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Ready Yet - LiLLey Kasang Cakes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fffaf0;
            /* Warm bakery cream background */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .card {
            background-color: #ffffff;
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(205, 114, 22, 0.15);
            max-width: 480px;
            width: 100%;
            text-align: center;
            border: 2px solid #f3d4a0;
        }

        .meme-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            object-position: top center;
            /* Focuses on your face and upper body */
            border-radius: 50%;
            /* Makes the photo a clean circle */
            border: 4px solid #cd7216;
            /* Matching primary brand orange */
            margin-bottom: 1.5rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        /* --- TEXT STYLES --- */
        h1 {
            color: #cd7216;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .sub-text {
            color: #666666;
            font-size: 1rem;
            margin-bottom: 1.5rem;
        }

        /* --- INSCRIPTION BOX --- */
        .inscription-box {
            background-color: #fff8e7;
            padding: 1.25rem;
            border-radius: 12px;
            border-left: 5px solid #cd7216;
            margin-bottom: 2rem;
        }

        .inscription {
            font-size: 1.25rem;
            font-weight: 700;
            color: #333333;
            font-style: italic;
        }

        /* --- BUTTON STYLES --- */
        .back-btn {
            display: inline-block;
            padding: 0.85rem 1.75rem;
            background-color: #cd7216;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .back-btn:hover {
            background-color: #723903;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="card">
        <img src="/logo and images/B.B pic.jpeg" alt="Disappointed posture with hands folded" class="meme-img">

        <h1>NOT READY YET!</h1>
        <p class="sub-text">Our online checkout system is currently under construction.</p>

        <div class="inscription-box">
            <p class="inscription">"Poor man, wetin u wan buy? 😂"</p>
        </div>

        <a href="index.html" class="back-btn">Go Back Home</a>
    </div>

</body>

</html>
